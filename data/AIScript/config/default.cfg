
//----------------------------------------------------------------------
//
// Hey anyone reading this, here's the exhaustive list of available settings.
//
//---- Misc -------------------------------------
//
// BaseConfig:						string
//									Comma-separated list of base configs.  These get applied
//									in the order listed, and THEN the config itself is applied.
//
//---- Brain ------------------------------------
//
// Brain.Name:						string
//									Name of brain.  Corresponds to hardcoded names.
//
//---- Feeling ------------------------------------
//
//	Team.AssignTargetPriority:		int
//									Affects the order of team target assignment.  Higher is earlier.
//
//---- Feeling ------------------------------------
//
//	Feeling.Scale.MeAttacked:		float [0-1]
//									How much I care that I was attacked.
//	Feeling.Scale.FriendAttacked:	float [0-1]
//									How much I care that my friend was attacked.
//	
//	Feeling.Base.Fear:				float [0-1]
//	Feeling.Base.Confidence:		float [0-1]
//	Feeling.Base.Loyalty:			float [0-1]
//	Feeling.Base.Bothered:			float [0-1]
//									My base fear, confidence, loyalty, and bothered.
//
//---- TargetPreference struct-------------------------------
//
//	TargetPreference				Optional, can have several
//	{
//		Archetype:					string [ex: Class_Warshade]
//									What archetype I like to attack		
//		Factor:		10.0			float 
//									Factor by which I prefer attacking this archetype. (1.0=base, <1.0 reduces preference, >1.0 increases)
//	}
//
//---- PowerConfig struct-------------------------------
//
//	PowerConfig						Optional, can have several
//	{
//		PowerName:					string [ex: MyAwesomeHealingPower]
//									What power this block describes
//		AllowedTarget:				string [ex: MindlessGrunt1,HorribleBoss3]
//									Which targets you're allowed to cast this power on (comma seperated list of villaindef names)
//		AllowMultipleBuffs:			<bool>
//									Allow this power to circumvent the "don't use multiple buffs at the same time" code
//		DoNoToggleOff:				<bool>
//									If this is a toggle power, setting this to 1 will prevent the power from toggling off after 20 sec.
//	}
//
//---- Misc ------------------------------------
//
//	Misc.AlwaysFly:					<bool>
//									Forces AI to always use Fly settings and Fly motion type, even if the pathing is ground or jump type
//	Misc.AlwaysHit:					<bool>
//									Makes me always hit when using powers.
//	Misc.ConsiderEnemyLevel:		<bool>
//									Whether I care about enemy level (used for pets).
//	Misc.DoAttackAI:				<bool>
//									Whether to do attack portion of attack AI (used for skyraiders forcefield generator).
//	Misc.DoNotAssignToMelee:		<bool>
//									Prevents melee team assignment.
//	Misc.DoNotAssignToRanged:		<bool>
//									Prevents ranged team assignment.
//	Misc.DoNotFaceTarget:			<bool>
//									Disables facing target in AI and when using a power.
//	Misc.DoNotGoToSleep:			<bool>
//									1 == Do Not Go To Sleep
//	Misc.DoNotMove:					<bool>
//									1 == Entity can not move
//	Misc.DoNotShareInfoWithMembers:		<bool>
//									1 == Entity can't be assigned team AI updates
//	Misc.EventMemoryDuration:		<float> (units=seconds)
//									# of seconds that I rememeber things (getting attacked, where my target is, etc).
//	Misc.FindTargetInProximity		<bool>
//									1 == Look for targets
//	Misc.FOVDegrees:				float (degrees)
//									My field-of-view in degrees.
//	Misc.GriefHPRatio:				float
//									HP threshold for when grief mode begins.
//	Misc.GriefTimeBegin:			<float> (units=seconds)
//									When grief mode begins.
//	Misc.GriefTimeEnd:				<float> (units=seconds)
//									How long after I've been attacked that I'm not in griefed mode.
//	Misc.IgnoreFriendsAttacked:		<bool>
//									Doesn't notice friends being attacked.
//	Misc.IgnoreTargetStealthRadius:	<bool>
//									Removes the use of a target's fStealthRadius when checking visibility.
//	Misc.Invincible:				<bool>
//									Make me invincible.
//	Misc.IsResurrectable:			<bool>
//									Make me be resurrectable by a teammate.
//	Misc.KeepSpawnPYR:				<bool>
//									Return to my original orientation when I get back to my spawn point.
//	Misc.NoPhysics:					<bool>
//									Never ever move for any reason
//	Misc.OnTeamEvil:				<bool>
//									Puts me on team evil.
//	Misc.OnTeamGood:				<bool>
//									Puts me on team good.
//	Misc.OverridePerceptionRadius:	<int> (units=feet)
//									Radius in which other entities will be noticed (0 == no override)
//	Misc.PathLimited:				<bool>
//									Limits me to only pathfinding/moving in pathlimitedallowed volumes
//	Misc.PerceiveAttacksWithoutDamage: <bool>
//									Allows zero magnitude attacks to notify the AI so that ultracowards can run away
//	Misc.PreferGroundCombat:		<bool>
//									Makes me want to land when I'm in combat
//	Misc.PreferMelee:				<bool>
//									Forces team assignment to be melee.
//	Misc.PreferMeleeScale:			float
//									Scales the decisions related to switching from melee to ranged weapons (higher means
//									more likely to do melee). Default scale of 1.0 means that he will wait 5s? before
//									switching to ranged.  More than a scale of 4 or 5 is not recommended.
//	Misc.PreferRanged:				<bool>
//									Forces team assignment to be ranged.
//	Misc.PreferRangedScale:			float
//									If this is != 1 this scales how many members of a team are assigned to a target,
//									a scale of 2 will assign twice as many HP's worth of guys to a target
//	Misc.PreferUntargeted:			<bool>
//									Will prefer a target that isn't being targeted by anyone.
//	Misc.ProtectSpawnOutsideRadius:	<float> (units=feet)
//									Min radius to a target that will maintain agro when outside spawn area.
//	Misc.ProtectSpawnRadius:		<float> (units=feet)
//									How near my	spawn point I will stay agroed to a foe.
//	Misc.ProtectSpawnTime:			<float> (units=seconds)
//									How long I will chase a foe outside my spawn area after he has attacked me.
//	Misc.Relentless:				<bool>
//									Sticks to current target until dead.
//	Misc.ReturnToSpawnDistance:		<float> (units=feet)
//									How close I need to be to my spawn point before I've "returned" satisfactorily.
// 	Misc.ShoutRadius:				<float> (units=feet)
//									Max radius at which I will notify my friends that I have a target.
//	Misc.ShoutChance:				int (percent)
//									The percent chance of notifying a friend that I have a target.
//	Misc.StandoffDistance:			<float> (units=feet)
//									How far away from the movement target to stop.
//	Misc.TargetedSightAddRange:		<float> (units=feet)
//									Feet to add to my visibility range when I look for my current target.
//	Misc.TurnWhileIdle:				<bool>
//									Whether to turn around randomly while sitting idle.
//	Misc.Untargetable:				<bool>
//									Makes me untargetable by powers and AI attackers will ignore me.
//	Misc.WalkToSpawnRadius:			<float> (units=feet)
//									Radius within which I will switch to walking when returning to spawn. 
//---- Powers ------------------------------------
//
//	Powers.MaxPets:					<int>
//									Number of pets at which to disallow the usage of pgPet powers
//	Powers.ResurrectArchvillains:	<bool>
//									Allows resurrect powers to be used on archvillains
//	Powers.UseRangeAsMaximum:		<bool>
//									The power range specified by the powers guys is a maximum range

Config: Default
{
	Brain.Name:							DEFAULT

	Feeling.Scale.MeAttacked:			1
	Feeling.Scale.FriendAttacked:		1
	
	Feeling.Base.Fear:					0.2
	Feeling.Base.Confidence:			1.0
	Feeling.Base.Loyalty:				0.0
	Feeling.Base.Bothered:				0.0

	Misc.EventMemoryDuration:			20
	Misc.TargetedSightAddRange:			100

	Misc.IgnoreFriendsAttacked:			0

	Misc.PreferMeleeScale:				1.0
	Misc.PreferRangedScale:				1.0

	Misc.ConsiderEnemyLevel:			1

	Misc.ReturnToSpawnDistance:			20

	Misc.KeepSpawnPYR:					0
	Misc.ProtectSpawnRadius:			100
	Misc.ProtectSpawnTime:				30
	Misc.ProtectSpawnOutsideRadius:		20
	Misc.WalkToSpawnRadius:				70

	Misc.FOVDegrees:					240
	
	Misc.DoAttackAI:					1
	Misc.FindTargetInProximity:			1

	Misc.ShoutChance:					50
	Misc.ShoutRadius:					30

	Misc.GriefHPRatio:					0.7
	Misc.GriefTimeBegin:				10
	Misc.GriefTimeEnd:					30

	Misc.IsResurrectable:				1

	Misc.TurnWhileIdle:					1

	Misc.DoNotFaceTarget:				0
	Misc.DoNotGoToSleep:				0
	Misc.DoNotMove:						0
	Misc.NoPhysics:						0

	Misc.IgnoreTargetStealthRadius:		0

	Misc.Untargetable:					0
	Misc.Invincible:					0
	
	Misc.StandoffDistance:				10.0
	Misc.PathLimited:					0
	
	Misc.OverridePerceptionRadius:		0
	
	Misc.PerceiveAttacksWithoutDamage:	0
	
	Powers.MaxPets:						20
	Powers.ResurrectArchvillains:		0

	// Assign default powers.

	AssignPowerByName:					pgFlyEffect,		fly_fx

	AssignPowerByFlag:					pgBuff,			kBuff
	AssignPowerByFlag:					pgDebuff,		kDebuff
	AssignPowerByFlag:					pgVictor,		kVictor
	AssignPowerByFlag:					pgPostDeath,		kPostDeath
	AssignPowerByFlag:					pgBuff,			kToggleDefense
	AssignPowerByFlag:					pgToggleHarm,		kToggleHarm
	AssignPowerByFlag:					pgToggleAoEBuff,	kToggleAoEBuff
	AssignPowerByFlag:					pgBuff,			kBuffSelf
	AssignPowerByFlag:					pgDebuff,		kDebuffFoe
	AssignPowerByFlag:					pgBuff,			kBuffAlly
	AssignPowerByFlag:					pgHealSelf,		kHealSelf
	AssignPowerByFlag:					pgHealAlly,		kHealAlly
	AssignPowerByFlag:					pgDebuff,		kPuddle
	AssignPowerByFlag:					pgSummon,		kSummon
	AssignPowerByFlag:					pgKamikaze,		kKamikaze
	AssignPowerByFlag:					pgRoot,			kRoot
	AssignPowerByFlag:					pgResurrect,		kResurrect
	AssignPowerByFlag:					pgEarlyBattle,		kEarlyBattle
	AssignPowerByFlag:					pgMidBattle,		kMidBattle
	AssignPowerByFlag:					pgEndBattle,		kEndBattle
	AssignPowerByFlag:					pgHellionFire,		kHellionFire
	AssignPowerByFlag:					pgPet,			kPet
	AssignPowerByFlag:					pgSecondaryTarget,	kSecondaryTarget

	// This is the catch-all that makes anything left-over into an attack.

	AssignPowerNoFlags:					pgBasicAttack
}

