// In a group, they're mindles unless a Lt or Boss is attacked. When a leader
//  is attacked, at least three of the minions fall back to protect the leader.


//----------------------------------------------------------------------

Config: BanishedPantheon_Minion
{
	BaseConfig:				Default

	// Brain for minions
	Brain.Name:				BANISHED_PANTHEON

}

//----------------------------------------------------------------------

Config: BanishedPantheon_Spirit_of_Pain
{
	BaseConfig:				Default

	// Attacks only one opponent until one of the two dies
	Misc.Relentless:				1

	// Don't get afraid when friends die
	Misc.IgnoreFriendsAttacked:		1
	Feeling.Scale.MeAttacked:		0
	Feeling.Scale.FriendAttacked:	0
}


Config: BanishedPantheon_Spirit_of_Death
{
	// Attacks only one opponent until one of the two dies
	// Launches power after killing an opponent (power probably kills self)

	BaseConfig:				BanishedPantheon_Spirit_of_Pain

	// Powers.
// Done in default.cfg now (by flag)
//	AssignPowerByName:		pgVictor, Suicide

}

Config: BanishedPantheon_Spirit_of_Sorrow
{
	// Always moves (around combat)

	BaseConfig:				Default

	Brain.Name:				BANISHED_PANTHEON_SORROW

	Misc.DoNotAssignToMelee:			1

}

// BanishedPantheon_Spirit_of_Desire - nothing special


Config: BanishedPantheon_Husk
{
	// Mindless Group, HtH, Sometimes not effective - stupid, Zombie Movement

	BaseConfig:				BanishedPantheon_Minion

	// Copied from VahzilokZombie:
	Misc.EventMemoryDuration:			8
	Misc.TargetedSightAddRange:			0
	Misc.PreferMelee:					1
	Misc.PreferMeleeScale:				4.0

	Misc.IgnoreFriendsAttacked:			1

	Feeling.Scale.MeAttacked:			0
	Feeling.Scale.FriendAttacked:		0


}

Config: BanishedPantheon_Chamber
{
	BaseConfig: BanishedPantheon_Husk
}

Config: Pets_Summoned_Husk
{
	BaseConfig: BanishedPantheon_Husk
}

Config: BanishedPantheon_WitchDoctor
{
	BaseConfig:				Default
	Brain.Name:				BANISHED_PANTHEON_LT

	Misc.PreferRanged:					1

	// Very Ranged, Debuffing, if less that two minions left, uses summon - normal human movement
}

