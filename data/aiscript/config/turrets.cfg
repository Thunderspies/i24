
// Turrets_Base is the AIConfig for the turrets, not for the turret bases (which use default stationary).  
// If I ever figure out who set these up this way, I will kill them.
Config: Turrets_Base
{
	BaseConfig:						Default_Ranged

	Misc.FOVDegrees:				360

	Misc.TargetedSightAddRange:		250

	Misc.ProtectSpawnRadius:		350
	Misc.ProtectSpawnTime:			20
	Misc.ProtectSpawnOutsideRadius:	0

	Misc.TurnWhileIdle:				0

	Feeling.Base.Bothered:			1.0

	Misc.NoPhysics:						1
}


