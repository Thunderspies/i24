{
	BaseConfig:						Default_Ranged

	Misc.FOVDegrees:				360

	Feeling.Base.Bothered:			1.0
	Misc.ConsiderEnemyLevel:		0
}

Config: RV_Turrets_With_ForceField
{
	BaseConfig:						Turrets_Base
	
	Brain.Name:						HYDRA_FORCEFIELD_GENERATOR

//	AssignPowerByFlag:				pgForceField, kForceField	
}

Config: RV_ForceField_Generator
{
	BaseConfig:						Default_Stationary
	Brain.Name:						HYDRA_HEAD

